name: harness-lint

on:
  pull_request:
    paths:
      - "HARNESS.md"
      - "harness/**"
      - "examples/**/HARNESS.md"
      - "bin/**"
      - "schema/**"
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint root harness
        run: node bin/bridle.mjs lint HARNESS.md
      - name: Lint example harnesses
        run: |
          for f in examples/*/HARNESS.md; do
            echo "--- $f"
            node bin/bridle.mjs lint "$f"
          done
